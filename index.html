<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il Rimpianto ti Guida o ti Blocca? | Uno Come Voi</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1623;
    --card: #1a2236;
    --card2: #1e2a40;
    --accent: #4f8ef7;
    --accent2: #7bb3ff;
    --accent-glow: rgba(79,142,247,0.18);
    --text: #e8eef8;
    --text-muted: #8da0be;
    --border: rgba(79,142,247,0.18);
    --success: #4fd1a0;
    --danger: #f76f6f;
    --bar-bg: rgba(79,142,247,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 60px;
    background-image: radial-gradient(ellipse at 20% 20%, rgba(79,142,247,0.07) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 80%, rgba(123,179,255,0.05) 0%, transparent 60%);
  }

  .header {
    text-align: center;
    margin-bottom: 36px;
    margin-top: 16px;
  }

  .brand {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
    opacity: 0.9;
  }

  .caffè-number {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 7vw, 46px);
    font-weight: 900;
    line-height: 1.1;
    color: var(--text);
    margin-bottom: 14px;
  }

  h1 span {
    color: var(--accent);
  }

  .subtitle {
    font-size: 15px;
    color: var(--text-muted);
    line-height: 1.6;
    max-width: 400px;
    margin: 0 auto;
  }

  /* QUIZ CARD */
  .quiz-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px;
    max-width: 560px;
    width: 100%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(79,142,247,0.06);
  }

  /* PROGRESS */
  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }

  .q-counter {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  .progress-bar-wrap {
    flex: 1;
    height: 4px;
    background: var(--bar-bg);
    border-radius: 99px;
    margin: 0 14px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }

  .q-score {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
  }

  /* QUESTION */
  .question-block {
    animation: fadeUp 0.35s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .q-num {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .q-scenario-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .q-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(16px, 4vw, 19px);
    font-weight: 700;
    line-height: 1.45;
    color: var(--text);
    margin-bottom: 26px;
  }

  /* OPTIONS */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    background: var(--card2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    text-align: left;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
    transition: all 0.2s ease;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .option-btn:hover {
    border-color: var(--accent);
    background: rgba(79,142,247,0.08);
    transform: translateX(3px);
  }

  .option-btn.selected {
    border-color: var(--accent);
    background: rgba(79,142,247,0.13);
    box-shadow: 0 0 0 3px rgba(79,142,247,0.1);
  }

  .option-letter {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--bar-bg);
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.2s;
  }

  .option-btn.selected .option-letter {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .option-text { flex: 1; }

  /* NEXT BUTTON */
  .next-btn {
    margin-top: 24px;
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 15px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: none;
    box-shadow: 0 4px 20px rgba(79,142,247,0.3);
  }

  .next-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(79,142,247,0.45);
  }

  .next-btn.visible { display: block; }

  /* RESULT */
  .result-block {
    display: none;
    animation: fadeUp 0.4s ease both;
  }

  .result-block.visible { display: block; }

  .result-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(79,142,247,0.12);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 6px 16px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
  }

  .result-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 6vw, 32px);
    font-weight: 900;
    line-height: 1.15;
    margin-bottom: 6px;
    color: var(--text);
  }

  .result-score-line {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .result-score-line strong {
    color: var(--accent);
  }

  .result-desc {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text-muted);
    margin-bottom: 20px;
    border-left: 3px solid var(--accent);
    padding-left: 16px;
  }

  .result-action {
    background: rgba(79,142,247,0.07);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 24px;
  }

  .result-action strong {
    display: block;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .retry-btn {
    width: 100%;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 13px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .retry-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* FOOTER */
  .footer {
    margin-top: 32px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    opacity: 0.6;
  }

  .footer a {
    color: var(--accent);
    text-decoration: none;
    opacity: 0.8;
  }
</style>
</head>
<body>

<div class="header">
  <div class="brand">☕ Uno Come Voi</div>
  <div class="caffè-number">· Il test dell'articolo ·</div>
  <h1>Il rimpianto ti guida<br><span>o ti blocca?</span></h1>
  <p class="subtitle">5 scenari concreti. Scopri che rapporto hai con le scelte che non puoi più cambiare.</p>
</div>

<div class="quiz-card" id="quizCard">

  <!-- PROGRESS -->
  <div class="progress-row">
    <span class="q-counter" id="qCounter">Domanda 1 di 5</span>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <span class="q-score" id="scoreDisplay">0 pt</span>
  </div>

  <!-- QUESTION -->
  <div class="question-block" id="questionBlock">
    <div class="q-num" id="qNum">01 —</div>
    <div class="q-scenario-label">Scenario</div>
    <div class="q-text" id="qText"></div>
    <div class="options" id="optionsContainer"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Prossima domanda →</button>
  </div>

  <!-- RESULT -->
  <div class="result-block" id="resultBlock">
    <div class="result-badge">🧠 Il tuo profilo</div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-score-line" id="resultScoreLine"></div>
    <div class="result-desc" id="resultDesc"></div>
    <div class="result-action" id="resultAction"></div>
    <button class="retry-btn" onclick="restartQuiz()">↩ Rifai il test</button>
  </div>

</div>

<div class="footer">
  Con Affetto — Teo ☕ &nbsp;·&nbsp; <a href="https://uno-come-voi.com" target="_blank">uno-come-voi.com</a>
</div>

<script>
const questions = [
  {
    num: "01",
    scenario: "Scenario",
    text: "Ti torna in mente una scelta di anni fa: un lavoro rifiutato, una persona lasciata andare, un viaggio mai fatto. Cosa succede dentro di te?",
    options: [
      { letter: "A", text: "Ci ripenso spesso e mi rovina l'umore per ore. Se solo avessi scelto diversamente...", points: 0 },
      { letter: "B", text: "Mi chiedo 'e se...', mi concedo un po' di malinconia, poi torno al presente.", points: 3 },
      { letter: "C", text: "Cerco di non pensarci mai: chiudo subito il cassetto e passo oltre.", points: 1 },
      { letter: "D", text: "Riconosco che, con quello che sapevo allora, ho fatto del mio meglio. E questo mi basta.", points: 4 }
    ]
  },
  {
    num: "02",
    scenario: "Scenario",
    text: "Un amico ti racconta che ha appena fatto proprio la cosa che tu rimandi da anni. Qual è la tua prima reazione?",
    options: [
      { letter: "A", text: "Mi brucia, ma mi chiedo cosa potrei fare io adesso, anche in piccolo, per avvicinarmi a quel sogno.", points: 4 },
      { letter: "B", text: "Un po' di invidia e un pensiero fisso: 'ormai per me è troppo tardi'.", points: 0 },
      { letter: "C", text: "Gli chiedo come ha fatto e mi segno qualche idea, anche se non so se la userò.", points: 3 },
      { letter: "D", text: "Mi complimento, poi cambio discorso in fretta.", points: 1 }
    ]
  },
  {
    num: "03",
    scenario: "Scenario",
    text: "Oggi devi prendere una decisione importante. Quanto pesa la paura di pentirtene?",
    options: [
      { letter: "A", text: "Raccolgo mille opinioni per avere la certezza di non sbagliare.", points: 1 },
      { letter: "B", text: "Decido d'istinto, così non ci penso troppo e non mi blocco.", points: 2 },
      { letter: "C", text: "Così tanto che spesso non decido affatto e lascio che sia il tempo a scegliere per me.", points: 0 },
      { letter: "D", text: "La sento, ma mi chiedo: 'tra 10 anni di cosa mi pentirò di più, di averci provato o di non averlo fatto?'", points: 4 }
    ]
  },
  {
    num: "04",
    scenario: "Scenario",
    text: "Qualcuno ti chiede di raccontare il tuo passato. Con quale frase ti descriveresti?",
    options: [
      { letter: "A", text: "\"Ho sbagliato quasi tutto. Se tornassi indietro farei tutto diverso.\"", points: 0 },
      { letter: "B", text: "\"La vita non mi ha dato molte possibilità, è andata così.\"", points: 1 },
      { letter: "C", text: "\"Ho fatto delle scelte. Alcune sono andate male, ma almeno ci stavo provando.\"", points: 4 },
      { letter: "D", text: "\"Preferisco non parlarne, guardo avanti.\"", points: 2 }
    ]
  },
  {
    num: "05",
    scenario: "Scenario",
    text: "Pensa al tuo rimpianto più grande. Oggi, concretamente, cosa ne fai?",
    options: [
      { letter: "A", text: "È ancora una ferita aperta: ci torno sopra di continuo.", points: 0 },
      { letter: "B", text: "Lo uso come promemoria per non ripetere lo stesso errore.", points: 3 },
      { letter: "C", text: "L'ho seppellito: faccio finta che non esista.", points: 1 },
      { letter: "D", text: "Ho provato a rimediare o a fare qualcosa di simile adesso, nel modo che oggi mi è possibile.", points: 4 }
    ]
  }
];

const results = [
  {
    min: 0, max: 4,
    title: "Il Prigioniero del Passato",
    desc: "I tuoi rimpianti non sono più ricordi: sono diventati una parte di chi sei. Ti giudichi con gli occhi di oggi per scelte fatte con le informazioni di allora, e questo non è giusto nei tuoi confronti. Il rimpianto non è la prova che hai fallito. È la prova che hai vissuto e scelto. Il problema nasce quando smetti di dire 'ho fatto una scelta' e inizi a dire 'sono uno che sbaglia tutto'.",
    action: "⚡ La tua azione questa settimana: Scrivi su un foglio il tuo rimpianto più grande. Accanto, scrivi cosa sapevi e cosa stavi vivendo in quel momento, non quello che sai oggi. Rileggilo come se fosse la storia di un amico: con lo stesso rispetto."
  },
  {
    min: 5, max: 8,
    title: "Il Collezionista di \"E se...\"",
    desc: "La tua mente è bravissima a immaginare versioni alternative della tua vita. Il guaio è che quelle versioni sono sempre perfette, e la tua realtà non può competere. Ma il 'e se...' non ha risposta: nessuno sa se l'altra strada ti avrebbe reso più felice. Stai confrontando la tua vita vera con un film che non è mai esistito.",
    action: "⚡ La tua azione questa settimana: La prossima volta che ti sorprendi a pensare 'e se avessi...', fermati e completa la frase al contrario: 'e se oggi facessi...'. Sposta il 'e se' dal passato al presente."
  },
  {
    min: 9, max: 12,
    title: "Il Nostalgico Consapevole",
    desc: "I rimpianti ce li hai, e non fai finta del contrario. Sai guardarli in faccia senza farti travolgere, anche se ogni tanto ti trascinano giù più di quanto vorresti. Sei a metà strada: hai capito che scegliere significa rinunciare, ora si tratta di smettere di rinunciare per paura.",
    action: "⚡ La tua azione questa settimana: Individua UNA cosa che stai rimandando oggi e che tra 10 anni ti dispiacerebbe non aver fatto. Fai il primo passo, anche minuscolo, entro domenica."
  },
  {
    min: 13, max: 16,
    title: "L'Osservatore Lucido",
    desc: "Riesci a guardare il tuo passato con la giusta distanza, come la biografia di qualcuno a cui vuoi bene. Sai che ogni sì contiene un no, e non ti flagelli per questo. I rimpianti per te sono informazioni, non condanne. Ed è proprio questo che ti permette di scegliere meglio oggi.",
    action: "⚡ La tua azione questa settimana: Racconta a qualcuno di cui ti fidi un rimpianto che hai trasformato in lezione. A volte la tua storia è esattamente quello che serve a chi è ancora bloccato. Se ti va, scrivimelo nei commenti o nel Forum."
  },
  {
    min: 17, max: 20,
    title: "Hai Pagato il Biglietto",
    desc: "Hai capito una cosa che a molti richiede una vita intera: i rimpianti sono il prezzo del biglietto per aver vissuto davvero. Non li eviti, non li ingigantisci, li usi. E quando senti di aver lasciato indietro qualcosa, cerchi il modo di recuperarlo adesso, invece di piangerci sopra. Questo è raro. Davvero.",
    action: "⚡ La tua azione questa settimana: Usa questa serenità per scegliere qualcosa di coraggioso: una telefonata, un progetto, una scusa da chiedere. Sono proprio le cose che non facciamo quelle che, alla lunga, pesano di più."
  }
];

let currentQ = 0;
let totalScore = 0;
let selectedPoints = null;

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('qCounter').textContent = `Domanda ${currentQ + 1} di ${questions.length}`;
  document.getElementById('qNum').textContent = q.num + ' —';
  document.getElementById('qText').textContent = q.text;
  document.getElementById('progressBar').style.width = `${(currentQ / questions.length) * 100}%`;
  document.getElementById('scoreDisplay').textContent = totalScore + ' pt';

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${opt.letter}</span><span class="option-text">${opt.text}</span>`;
    btn.onclick = () => selectOption(i, opt.points, btn);
    container.appendChild(btn);
  });

  selectedPoints = null;
  const nb = document.getElementById('nextBtn');
  nb.classList.remove('visible');
  nb.textContent = currentQ < questions.length - 1 ? 'Prossima domanda →' : 'Scopri il tuo profilo →';

  // re-animate
  const qb = document.getElementById('questionBlock');
  qb.style.animation = 'none';
  qb.offsetHeight;
  qb.style.animation = 'fadeUp 0.35s ease both';
}

function selectOption(index, points, btn) {
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedPoints = points;
  document.getElementById('nextBtn').classList.add('visible');
}

function nextQuestion() {
  if (selectedPoints === null) return;
  totalScore += selectedPoints;

  if (currentQ < questions.length - 1) {
    currentQ++;
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('questionBlock').style.display = 'none';
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('qCounter').textContent = `Completato!`;
  document.getElementById('scoreDisplay').textContent = totalScore + ' pt';

  const result = results.find(r => totalScore >= r.min && totalScore <= r.max) || results[results.length - 1];

  document.getElementById('resultTitle').textContent = result.title;
  document.getElementById('resultScoreLine').innerHTML = `Hai totalizzato <strong>${totalScore} punti</strong> su 20`;
  document.getElementById('resultDesc').textContent = result.desc;
  document.getElementById('resultAction').innerHTML = `<strong>⚡ La tua azione questa settimana</strong>${result.action.replace('⚡ La tua azione questa settimana: ', '')}`;

  const rb = document.getElementById('resultBlock');
  rb.classList.add('visible');
}

function restartQuiz() {
  currentQ = 0;
  totalScore = 0;
  selectedPoints = null;
  document.getElementById('questionBlock').style.display = 'block';
  document.getElementById('resultBlock').classList.remove('visible');
  renderQuestion();
}

renderQuestion();
</script>
</body>
</html>
